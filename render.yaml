# LeetSense on Render's free tier — API, sync worker and cache.
#
# Create it from the Render dashboard: New → Blueprint → pick this repo.
# Render reads this file and provisions everything, prompting for the values
# marked `sync: false`.
#
# Two pieces are deliberately NOT here:
#
#   Postgres — Render's free Postgres is deleted 30 days after creation, which
#   is no good for a link meant to keep working. Use Neon's free tier instead
#   and paste its connection string into DATABASE_URL.
#
#   ChromaDB — the free plan has no persistent disk, and Chroma's index has to
#   survive a restart. Use Chroma Cloud's free tier and fill in the three
#   CHROMA_* values. Leave them blank and chat still answers, just without
#   retrieval grounding — `queryChunks` degrades rather than failing.

services:
  - type: web
    name: leetsense-api
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    # Fails the deploy if the app can't reach Postgres, rather than going live
    # broken.
    healthCheckPath: /api/health/ready
    # Pushes the schema, then starts the API. A bare path, because Render
    # quotes this value into a single word — a chained `a && b` command comes
    # back as "sh: 1: <the whole string>: not found" and exits 127.
    dockerCommand: ./apps/backend/docker-entrypoint.sh

    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_PORT
        value: "10000"
      # Render's free plan has no background workers, so the sync worker runs
      # inside the API process. Fine at this scale — syncs are IO-bound on
      # LeetCode's API rather than CPU-bound.
      - key: WORKER_IN_PROCESS
        value: "true"
      - key: CACHE_ENABLED
        value: "true"
      - key: STATS_CACHE_TTL
        value: "300"

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: leetsense-cache
          property: connectionString

      # --- Prompted for on first deploy ---
      # Neon connection string, with ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Must be exactly 64 hex characters: openssl rand -hex 32
      - key: ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # The Vercel URL, scheme included and no trailing slash. The refresh
      # cookie is refused if this does not match the frontend origin exactly.
      - key: CORS_ORIGIN
        sync: false
      # Chroma Cloud — leave blank to run without retrieval grounding.
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false

      # Generated by Render and never shown to anyone, which is all these need
      # to be — nothing outside this service verifies these signatures.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  - type: keyvalue
    name: leetsense-cache
    plan: free
    region: singapore
    # Reachable only from services in this workspace over the private network.
    ipAllowList: []
