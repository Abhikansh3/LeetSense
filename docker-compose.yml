services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leetsense
      POSTGRES_PASSWORD: leetsense
      POSTGRES_DB: leetsense
    ports:
      # Host 5433 to avoid clashing with a native Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetsense"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.20
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/chroma/chroma

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://leetsense:leetsense@postgres:5432/leetsense?schema=public
      REDIS_URL: redis://redis:6379
      CHROMA_URL: http://chromadb:8000
      BACKEND_PORT: 3000
      CORS_ORIGIN: http://localhost:3001
    # Uses DATABASE_URL from the container env (not a .env file). db push keeps
    # the schema in sync without checked-in migrations.
    command: sh -c "node_modules/.bin/prisma db push --schema packages/db/prisma/schema.prisma --skip-generate && node apps/backend/dist/index.js"
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://leetsense:leetsense@postgres:5432/leetsense?schema=public
      REDIS_URL: redis://redis:6379
      CHROMA_URL: http://chromadb:8000
    command: node apps/backend/dist/worker.js

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:3001"

  # --- Optional observability stack: `docker compose --profile monitoring up` ---
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  chromadata:
