name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Everything after this needs the generated client for its types.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The suite mocks every outbound socket, so no Postgres, Redis or Chroma
      # service container is needed here.
      - name: Test
        run: pnpm test:coverage

      - name: Publish coverage summary
        if: always()
        run: |
          summary=apps/backend/coverage/coverage-summary.json
          if [ ! -f "$summary" ]; then
            echo "No coverage report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Backend coverage"
            echo
            echo "| Metric | Covered | Total | % |"
            echo "| --- | --- | --- | --- |"
            node -e '
              const t = require("./apps/backend/coverage/coverage-summary.json").total;
              for (const k of ["statements", "branches", "functions", "lines"]) {
                const m = t[k];
                console.log(`| ${k} | ${m.covered} | ${m.total} | ${m.pct}% |`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: pnpm build
        env:
          # Baked into the frontend bundle at build time; CI only needs the
          # build to succeed, not to point anywhere real.
          NEXT_PUBLIC_API_URL: http://localhost:3000

  docker:
    name: Docker image (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: this proves the Dockerfiles still work against
      # the current lockfile. Publishing is the deploy's job, not CI's.
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
